# 간단한 CI/CD - Docker Compose(서버) 기반
# main/master/test-build 푸시 시 → 프론트 빌드 → 백엔드 bootBuildImage → 서버에 이미지 로드 → compose up

stages:
  - deploy

variables:
  FRONTEND_DIR: "S14P11A707-frontend"
  BACKEND_DIR: "S14P11A707-backend"
  REMOTE_COMPOSE_DIR: "/home/ubuntu/infra"
  # 서버 docker-compose.yml 의 backend.image 와 동일한 태그로 맞춰야 pull 없이 동작함
  REGISTRY_HOST: "lab.ssafy.com:5050"

  # dind (Docker-in-Docker) 사용
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""

deploy:
  stage: deploy
  image: gradle:8.10.0-jdk21-jammy
  services:
    - name: docker:27.0.3-dind
      command: ["--tls=false"]
  rules:
    - if: '$CI_COMMIT_REF_NAME =~ /^(main|master|test-build)$/'
  before_script:
    - apt-get update && apt-get install -y openssh-client docker.io
    # SSH 키 설정 (GitLab CI Variables에 EC2_SSH_KEY 등록 필요 - File 타입)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    # File 타입 변수는 cat으로 읽어야 함
    - cat "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan i14a707.p.ssafy.io >> ~/.ssh/known_hosts
  script:
    - |
      set -euo pipefail
      export IMAGE_TAG="prod"
      export PROJECT_PATH_LOWER="$(printf '%s' "$CI_PROJECT_PATH" | tr '[:upper:]' '[:lower:]')"
      export IMAGE_REPO="$REGISTRY_HOST/$PROJECT_PATH_LOWER/backend"
      export IMAGE_NAME="$IMAGE_REPO:$IMAGE_TAG"
      echo "IMAGE_NAME=$IMAGE_NAME"

      # Node.js 설치 (프론트 빌드용)
      curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      apt-get install -y nodejs

      # 프론트엔드 빌드
      cd "$FRONTEND_DIR"
      npm ci
      npm run build

      # 스프링부트 resources/static 폴더 생성 및 dist 복사
      cd "$CI_PROJECT_DIR"
      mkdir -p "$BACKEND_DIR/src/main/resources/static"
      rm -rf "$BACKEND_DIR/src/main/resources/static/"*
      cp -r "$FRONTEND_DIR/dist/"* "$BACKEND_DIR/src/main/resources/static/"

      # 스프링부트 이미지 빌드
      cd "$BACKEND_DIR"
      chmod +x gradlew
      ./gradlew --no-daemon bootBuildImage --imageName="$IMAGE_NAME"

      # 서버로 이미지 전송/로드 후 compose 재기동
      docker save "$IMAGE_NAME" | gzip -1 | ssh ubuntu@i14a707.p.ssafy.io "gunzip | docker load"
      ssh ubuntu@i14a707.p.ssafy.io "cd \"$REMOTE_COMPOSE_DIR\" && (docker compose up -d --pull never --remove-orphans backend || docker compose up -d --remove-orphans backend) && docker compose ps"

  environment:
    name: production
    url: http://i14a707.p.ssafy.io
