# 간단한 CI/CD - Docker Compose(서버) 기반
# main/master 푸시 시 → 프론트 빌드 → 백엔드 bootBuildImage → GitLab Registry push → 서버에서 compose pull/up

stages:
  - build
  - deploy

variables:
  FRONTEND_DIR: "S14P11A707-frontend"
  BACKEND_DIR: "S14P11A707-backend"
  REMOTE_COMPOSE_DIR: "/home/ubuntu/infra"
  REGISTRY_HOST: "$CI_SERVER_HOST:5050"
  IMAGE_TAG: "$CI_COMMIT_REF_SLUG"

  # dind (Docker-in-Docker) 사용
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""

# -----------------------------
# 1) 빌드: 프론트 → 백엔드 static 복사 → bootBuildImage + push
# -----------------------------
build:
  stage: build
  image: gradle:8.10.0-jdk21-jammy
  services:
    - name: docker:27.0.3-dind
      command: ["--tls=false"]
  rules:
    - if: '$CI_COMMIT_REF_NAME =~ /^(main|master)$/'
      variables:
        IMAGE_TAG: "prod"
    - if: '$CI_COMMIT_REF_NAME == "test-build"'
  script:
    - set -euo pipefail
    - export PROJECT_PATH_LOWER="$(printf '%s' "$CI_PROJECT_PATH" | tr '[:upper:]' '[:lower:]')"
    - export IMAGE_REPO="$REGISTRY_HOST/$PROJECT_PATH_LOWER/backend"
    - export IMAGE_NAME="$IMAGE_REPO:$IMAGE_TAG"
    - echo "REGISTRY_HOST=$REGISTRY_HOST"
    - echo "CI_PROJECT_PATH=$CI_PROJECT_PATH"
    - echo "IMAGE_REPO=$IMAGE_REPO"
    - echo "IMAGE_TAG=$IMAGE_TAG"
    - echo "IMAGE_NAME=$IMAGE_NAME"

    # Node.js 설치 (프론트 빌드용)
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y nodejs

    # 프론트엔드 빌드
    - cd "$FRONTEND_DIR"
    - npm ci
    - npm run build

    # 스프링부트 resources/static 폴더 생성 및 dist 복사
    - cd "$CI_PROJECT_DIR"
    - mkdir -p "$BACKEND_DIR/src/main/resources/static"
    - rm -rf "$BACKEND_DIR/src/main/resources/static/"*
    - cp -r "$FRONTEND_DIR/dist/"* "$BACKEND_DIR/src/main/resources/static/"

    # GitLab Container Registry 인증 설정 (~/.docker/config.json)
    - mkdir -p ~/.docker
    - |
      auth="$(printf "%s:%s" "gitlab-ci-token" "$CI_JOB_TOKEN" | base64 -w0)"
      printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$REGISTRY_HOST" "$auth" > ~/.docker/config.json

    # 스프링부트 이미지 빌드 + push
    - cd "$BACKEND_DIR"
    - chmod +x gradlew
    - ./gradlew --no-daemon bootBuildImage --publishImage --imageName="$IMAGE_NAME"

# -----------------------------
# 2) 배포: 서버에서 compose pull/up
# -----------------------------
deploy:
  stage: deploy
  image: ubuntu:24.04
  rules:
    - if: '$CI_COMMIT_REF_NAME =~ /^(main|master)$/'
  before_script:
    - apt-get update && apt-get install -y openssh-client
    # SSH 키 설정 (GitLab CI Variables에 EC2_SSH_KEY 등록 필요 - File 타입)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    # File 타입 변수는 cat으로 읽어야 함
    - cat "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan i14a707.p.ssafy.io >> ~/.ssh/known_hosts
  script:
    - |
      printf '%s' "$CI_JOB_TOKEN" | ssh ubuntu@i14a707.p.ssafy.io "docker login \"$REGISTRY_HOST\" -u gitlab-ci-token --password-stdin && cd \"$REMOTE_COMPOSE_DIR\" && docker compose pull backend && docker compose up -d --remove-orphans && docker compose ps"

  environment:
    name: production
    url: http://i14a707.p.ssafy.io
