# CI/CD - Docker Compose 방식
# main/master 푸시 시 → 프론트 빌드 → 백엔드 jar 빌드 → EC2 docker-compose 재시작

stages:
  - build
  - deploy

variables:
  FRONTEND_DIR: "S14P11A707-frontend"
  BACKEND_DIR: "S14P11A707-backend"
  DEPLOY_PATH: "/home/ubuntu/app"
  INFRA_PATH: "/home/ubuntu/infra"

# -----------------------------
# 1) 빌드: 프론트 → 백엔드 static 복사 → jar 생성
# -----------------------------
build:
  stage: build
  image: gradle:8.10.0-jdk21-jammy
  rules:
    - if: '$CI_COMMIT_REF_NAME =~ /^(main|master)$/'
  script:
    - set -euo pipefail

    # Node.js 설치 (프론트 빌드용)
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y nodejs

    # 프론트엔드 빌드
    - cd "$FRONTEND_DIR"
    - npm ci
    - npm run build

    # 스프링부트 resources/static 폴더 생성 및 dist 복사
    - cd "$CI_PROJECT_DIR"
    - mkdir -p "$BACKEND_DIR/src/main/resources/static"
    - cp -r "$FRONTEND_DIR/dist/"* "$BACKEND_DIR/src/main/resources/static/"

    # 스프링부트 jar 빌드
    - cd "$BACKEND_DIR"
    - chmod +x gradlew
    - ./gradlew --no-daemon bootJar

    # jar 파일을 artifact로 저장 (deploy 단계에서 사용)
    - cd "$CI_PROJECT_DIR"
    - mkdir -p artifacts
    - cp "$BACKEND_DIR"/build/libs/*.jar artifacts/app.jar
  artifacts:
    paths:
      - artifacts/app.jar
    expire_in: 1 hour

# -----------------------------
# 2) 배포: EC2에 jar 전송 + docker-compose 재시작
# -----------------------------
deploy:
  stage: deploy
  image: ubuntu:24.04
  rules:
    - if: '$CI_COMMIT_REF_NAME =~ /^(main|master)$/'
  before_script:
    - apt-get update && apt-get install -y openssh-client
    # SSH 키 설정
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - cat "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan i14a707.p.ssafy.io >> ~/.ssh/known_hosts
  script:
    # 배포 경로 생성
    - ssh ubuntu@i14a707.p.ssafy.io "mkdir -p $DEPLOY_PATH"

    # jar 파일 전송
    - scp artifacts/app.jar ubuntu@i14a707.p.ssafy.io:$DEPLOY_PATH/app.jar

    # docker-compose로 재시작
    - |
      ssh ubuntu@i14a707.p.ssafy.io "
        cd $INFRA_PATH

        # 기존 백엔드 컨테이너 중지 및 삭제
        docker compose stop backend 2>/dev/null || true
        docker compose rm -f backend 2>/dev/null || true

        # 백엔드 컨테이너 시작
        docker compose up -d backend

        # 로그 확인
        echo '=== 백엔드 컨테이너 시작 ==='
        docker compose ps backend
        echo '=== 최근 로그 ==='
        docker compose logs --tail=30 backend
      "

  environment:
    name: production
    url: http://i14a707.p.ssafy.io
