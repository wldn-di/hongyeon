spring:
  jpa:
    hibernate:
      ddl-auto: create-drop

  security:
    oauth2:
      client:
        provider:
          cognito:
            authorization-uri: https://example.com/oauth2/authorize
            token-uri: https://example.com/oauth2/token
            user-info-uri: https://example.com/oauth2/userInfo
            jwk-set-uri: https://example.com/.well-known/jwks.json
            user-name-attribute: sub
        registration:
          cognito:
            client-id: test-client
            client-authentication-method: none
            authorization-grant-type: authorization_code
            scope:
              - openid
              - email
            redirect-uri: "{baseUrl}/oauth2/code/{registrationId}"
