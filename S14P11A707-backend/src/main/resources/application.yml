spring:
  application:
    name: S14P11A707
  main:
    allow-bean-definition-overriding: true

  # 로컬/테스트: .env 파일을 사용하고 싶으면(선택)
  # - `.env` 파일은 properties 형식(KEY=VALUE)으로 작성
  # - 파일이 없으면 무시(optional)
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    driver-class-name: ${DB_DRIVER}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  sql:
    init:
      # pgvector 등 확장/기본 DDL은 schema.sql에서 관리
      # - 기본값은 embedded(=H2 등 내장 DB에서만 실행)로 두고,
      #   PostgreSQL에서 schema.sql을 실행하려면 SQL_INIT_MODE=always 로 명시
      mode: ${SQL_INIT_MODE:always}

  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: false

  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI}
        registration:
          keycloak:
            # Public client + PKCE (no client secret)
            client-id: ${KEYCLOAK_CLIENT_ID}
            client-authentication-method: none
            authorization-grant-type: authorization_code
            scope:
              - openid
              - email
              - profile
            redirect-uri: "{baseUrl}/oauth2/code/{registrationId}"
  ai:
    google:
      genai:
        api-key: ${SPRING_AI_GOOGLE_GENAI_API_KEY}
        chat:
          options:
            model: gemini-2.0-flash
        embedding:
          options:
            model: gemini-embedding-001
        base-url: https://generativelanguage.googleapis.com

springdoc:
  swagger-ui:
    with-credentials: true
  show-actuator: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    git:
      enabled: true
      mode: full

app:
  auth:
    # 로그인 완료 후 이동할 URL (상대경로 또는 절대 URL)
    # - 예) /swagger-ui/index.html
    # - 예) https://hongyeon.cloud-ip.cc/
    default-redirect-url: ${APP_AUTH_DEFAULT_REDIRECT_URL:/}
    # 절대 URL 리다이렉트를 허용할 origin allowlist (comma-separated)
    # - 예) https://hongyeon.cloud-ip.cc,http://localhost:5173
    allowed-redirect-origins: ${APP_AUTH_ALLOWED_REDIRECT_ORIGINS:}

server:
  # CloudFront/ALB/Nginx 뒤에서 {baseUrl}의 scheme/host가 꼬일 때 사용
  forward-headers-strategy: framework

  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:false}
        http-only: true
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
