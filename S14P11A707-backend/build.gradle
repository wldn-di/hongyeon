plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.9'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.gorylenko.gradle-git-properties' version '2.4.2'
}

group = 'com.ssafy'
version = findProperty("projectVersion") ?: "0.0.1-SNAPSHOT"
description = 'S14P11A707'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.14'

    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
}

tasks.register('deleteStaleBuildInfo') {
    outputs.upToDateWhen { false }
    doLast {
        def destinationDir = tasks.named('processResources').get().destinationDir
        delete(new File(destinationDir, "META-INF/build-info.properties"))
    }
}

tasks.named('processResources') {
    dependsOn(tasks.named('deleteStaleBuildInfo'))
}

tasks.named('bootBuildImage') {
    imageName = "detective-backend:${project.version}"
}
