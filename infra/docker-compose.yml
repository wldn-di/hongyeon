services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: detective-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgre}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ssafy1031}
      POSTGRES_DB: ${POSTGRES_DB:-hongyeon}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-network

  redis:
    image: redis:7-alpine
    container_name: detective-redis
    restart: always
    # NOTE: 비밀번호 없이 사용 (로컬/배포 동일 정책)
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend-network

  minio:
    image: minio/minio:latest
    container_name: detective-minio
    restart: always
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-ssafy1031}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - backend-network

  minio-init:
    image: minio/mc:latest
    container_name: detective-minio-init
    depends_on:
      - minio
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-ssafy1031}
      MINIO_BUCKET: ${MINIO_BUCKET:-hongyeon}
    entrypoint: >
      /bin/sh -c "
      echo 'waiting minio...';
      until mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" 2>/dev/null; do
        sleep 2;
      done;
      mc ls \"local/$$MINIO_BUCKET\" >/dev/null 2>&1 || mc mb -p \"local/$$MINIO_BUCKET\";
      mc anonymous set download \"local/$$MINIO_BUCKET\" || true;
      echo 'minio init done';
      "
    networks:
      - backend-network

  backend:
    image: lab.ssafy.com:5050/s14-webmobile2-sub1/s14p11a707/backend:prod
    container_name: detective-backend
    restart: always
    env_file:
      - ./.env.dev
    environment:
      - SPRING_DOCKER_COMPOSE_ENABLED=false
    volumes:
      - ${HOME:-/home/ubuntu}/.gcp:/home/ubuntu/.gcp:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - postgres
      - redis
      - minio
      - minio-init
    networks:
      - backend-network

  frontend:
    image: lab.ssafy.com:5050/s14-webmobile2-sub1/s14p11a707/frontend:prod
    container_name: detective-frontend
    restart: always
    networks:
      - backend-network

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx_proxy_manager
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:18081:81"
    volumes:
      - ./npm_data:/data
      - ./npm_letsencrypt:/etc/letsencrypt
    networks:
      - backend-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  backend-network:
    driver: bridge
